version: 2

models:
  - name: fct_orders
    description: >
      Order-level accumulating fact table at the grain of one row per order (order_id).
      Contains pre-aggregated line item counts, financial totals, customer review evaluations,
      and end-to-end logistics delivery performance metrics.
    columns:
      - name: order_id
        description: "Primary key of the order entity."
        tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: "Natural entity identifier of the customer linking to dim_customers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id

      - name: order_date_key
        description: "Integer surrogate date key (YYYYMMDD) linking to dim_date."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: order_status
        description: "Current lifecycle state of the order."
        tests:
          - not_null
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - invoiced
                - processing
                - unavailable
                - created
                - approved

      - name: total_items_count
        description: "Total count of physical item units in the order basket."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: items_gross_amount
        description: "Aggregate item revenue before shipping and logistics charges."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: freight_amount
        description: "Aggregate carrier freight cost charged for the order."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: total_order_amount
        description: "Total gross cart amount (items_gross_amount + freight_amount)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: total_payment_amount
        description: "Total settlement received across all tenders."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: payment_tenders_count
        description: "Number of separate payment tenders or vouchers applied to the order."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: max_payment_installments
        description: "Maximum credit installment plan duration selected by the buyer (0 if unpaid/voucher)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: highest_review_score
        description: "Peak customer review score (1 to 5 scale). Null if unreviewed."
        tests:
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 5

      - name: delivery_lead_time_status
        description: "Categorical delivery evaluation against SLA expectation."
        tests:
          - not_null
          - accepted_values:
              values:
                - 'On Time'
                - 'Delayed'
                - 'In Transit / Not Delivered'

  - name: fct_order_items
    description: >
      Line-item grain fact table representing individual SKU purchases.
      Enables product-level and seller-level margin, volume, and dispatch SLA analysis.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - order_id
            - order_item_id

    columns:
      - name: order_item_key
        description: "Surrogate primary key generated by hashing order_id and order_item_id."
        tests:
          - unique
          - not_null

      - name: order_id
        description: "Foreign key referencing the parent order in fct_orders."
        tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id

      - name: order_item_id
        description: "Sequential integer identifying the item index within the order."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1

      - name: product_id
        description: "Foreign key linking to dim_products."
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id

      - name: seller_id
        description: "Foreign key linking to dim_sellers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_id

      - name: customer_unique_id
        description: "Customer entity identifier linking to dim_customers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_unique_id

      - name: order_date_key
        description: "Surrogate date key (YYYYMMDD) linking to dim_date."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: shipping_limit_date_key
        description: "Target shipping cutoff date key (YYYYMMDD) linking to dim_date."
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: item_price
        description: "Unit selling price of the line item."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: freight_value
        description: "Carrier freight fee assigned to this line item."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: total_item_amount
        description: "Gross line-item total (item_price + freight_value)."
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: seller_dispatch_status
        description: "Evaluation of carrier handover speed against seller dispatch SLA."
        tests:
          - not_null
          - accepted_values:
              values:
                - 'Dispatched On Time'
                - 'Late Dispatch'
                - 'Not Dispatched'